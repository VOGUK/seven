<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SEVEN — Daily Word Grid</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;height:100%}
  :root{
    --bg:#eef2f8;
    --panel:#ffffff;
    --panel-2:#f1f5f9;
    --txt:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --border-strong:#94a3b8;
    --accent:#4f46e5;
    --accent-soft:rgba(79,70,229,.12);
    --correct-bg:#15803d;
    --correct-fg:#ffffff;
    --present-bg:#b45309;
    --present-fg:#ffffff;
    --absent-bg:#e2e8f0;
    --absent-fg:#475569;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 14px rgba(15,23,42,.09);
    --shadow-lg:0 16px 40px rgba(15,23,42,.16);
  }
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(99,102,241,.10),transparent 65%);
    color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 12px 4px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    color:#fff;display:grid;place-items:center;
    font-weight:900;font-size:18px;
    box-shadow:0 2px 10px rgba(99,102,241,.32);
  }
  .brand h1{
    font-size:17px;font-weight:800;letter-spacing:.16em;
    color:var(--txt);white-space:nowrap;
  }
  .icon-btn{
    width:46px;height:46px;border-radius:11px;flex:none;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--txt);
    font-family:inherit;font-size:17px;cursor:pointer;
    display:grid;place-items:center;
    box-shadow:var(--shadow-sm);
    transition:background .15s ease,transform .08s ease;
  }
  .icon-btn:active{background:var(--panel-2);transform:scale(.94)}

  /* ---------- status bar ---------- */
  .statusbar{
    flex:0 0 auto;
    display:flex;align-items:stretch;justify-content:space-between;gap:8px;
    padding:2px 12px 6px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    min-height:42px;padding:0 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.02em;
    white-space:nowrap;
    box-shadow:var(--shadow-sm);
    transition:background .15s ease,transform .08s ease,border-color .15s ease,color .15s ease;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  button.pill{cursor:pointer;color:var(--accent);background:linear-gradient(135deg,rgba(99,102,241,.10),rgba(6,182,212,.10));border-color:rgba(99,102,241,.30)}
  button.pill:active:not(:disabled){background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(6,182,212,.22));transform:scale(.96)}
  button.pill:disabled{cursor:default}
  .pill b{color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .pill .sparkle{color:#06b6d4;font-size:13px;line-height:1}
  .pill.used{
    background:linear-gradient(135deg,rgba(21,128,61,.10),rgba(22,163,74,.10));
    border-color:rgba(21,128,61,.30);
    color:#15803d;
  }
  .pill.used b{color:#15803d}
  .countdown-pill{color:var(--muted);flex:none}
  .countdown-pill b{margin-left:2px}

  /* ---------- board ---------- */
  .board-wrap{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:0 8px 0;
    overflow:hidden;
  }
  .board{
    --gap:5px;
    --pad:8px;
    --tile:44px;
    display:grid;
    grid-template-columns:repeat(7,var(--tile));
    grid-auto-rows:var(--tile);
    gap:var(--gap);
    padding:var(--pad);
    border-radius:16px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow-md);
    touch-action:manipulation;
    flex:none;
  }
  .tile{
    border-radius:7px;
    background:#fff;
    border:1.5px solid var(--border);
    display:grid;place-items:center;
    font-weight:800;
    font-size:calc(var(--tile) * .47);
    line-height:1;
    text-transform:uppercase;
    color:var(--txt);
    user-select:none;-webkit-user-select:none;
    transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease;
  }
  .tile.filled{
    background:#fff;
    border-color:var(--border-strong);
    box-shadow:inset 0 0 0 1px rgba(79,70,229,.14);
  }
  .tile.correct{
    background:var(--correct-bg);
    border-color:var(--correct-bg);
    color:var(--correct-fg);
  }
  .tile.present{
    background:var(--present-bg);
    border-color:var(--present-bg);
    color:var(--present-fg);
  }
  .tile.absent{
    background:var(--absent-bg);
    border-color:var(--absent-bg);
    color:var(--absent-fg);
  }
  /* brief red flash for words that are not in the dictionary */
  .tile.invalid{
    background:#fef2f2;
    border-color:#dc2626;
    color:#dc2626;
  }
  /* brief orange flash for words that have already been guessed */
  .tile.duplicate{
    background:#fff7ed;
    border-color:#ea580c;
    color:#ea580c;
  }
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  .tile.pop{animation:pop .15s ease}
  @keyframes flip{0%{transform:rotateX(0)}49%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .tile.shake{animation:shake .42s ease}
  @keyframes dance{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}65%{transform:translateY(3px)}}
  .tile.dance{animation:dance .65s ease}

  /* ---------- keyboard ---------- */
  .keyboard{
    flex:0 0 auto;
    flex-shrink:0;
    display:flex;flex-direction:column;gap:5px;
    padding:6px 4px 6px;
    touch-action:manipulation;
  }
  .krow{display:flex;gap:4px;justify-content:center}
  .key{
    flex:1 1 0;min-width:0;
    height:58px;
    border-radius:9px;
    background:var(--panel);
    border:1.5px solid var(--border);
    color:var(--txt);
    font-family:inherit;font-weight:800;font-size:15px;
    display:grid;place-items:center;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    padding:0;
    box-shadow:var(--shadow-sm);
    transition:transform .08s ease,background .15s ease,color .15s ease,border-color .15s ease;
  }
  .key:active{transform:scale(.94);background:var(--panel-2)}
  .key.wide{flex:1.7 1 0;font-size:11px;letter-spacing:.05em}
  .key.correct{background:var(--correct-bg);border-color:var(--correct-bg);color:#fff;box-shadow:none}
  .key.present{background:var(--present-bg);border-color:var(--present-bg);color:#fff;box-shadow:none}
  .key.absent{background:var(--absent-bg);border-color:var(--absent-bg);color:var(--absent-fg);box-shadow:none}

  /* On wider screens, keep the keyboard a sensible, centred size
     instead of letting the keys stretch across the whole viewport. */
  @media (min-width:720px){
    .keyboard{
      width:100%;
      max-width:620px;
      margin-left:auto;
      margin-right:auto;
      padding-left:0;
      padding-right:0;
    }
    .krow{gap:6px}
    .key{flex:0 0 50px;height:54px;font-size:15px}
    .key.wide{flex:0 0 76px;font-size:11px}
  }
  @media (min-width:1100px){
    .keyboard{max-width:680px}
    .key{flex:0 0 56px;height:58px;font-size:16px}
    .key.wide{flex:0 0 84px;font-size:11px}
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;z-index:50;
    transform:translate(-50%,-160%);
    padding:12px 20px;border-radius:12px;
    background:#0f172a;color:#fff;
    font-size:14px;font-weight:700;letter-spacing:.02em;
    box-shadow:0 14px 40px rgba(15,23,42,.35);
    transition:transform .26s cubic-bezier(.2,.9,.3,1.25),opacity .26s;
    opacity:0;pointer-events:none;white-space:nowrap;max-width:92vw;
  }
  .toast.show{transform:translate(-50%,0);opacity:1}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:60;
    display:grid;place-items:center;
    padding:16px;
    background:rgba(15,23,42,.45);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .overlay[hidden]{display:none}
  .modal{
    position:relative;
    background:var(--panel);
    border-radius:20px;
    box-shadow:var(--shadow-lg);
    width:100%;max-width:400px;
    max-height:88dvh;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .modal-body{
    padding:24px 20px 20px;
    overflow-y:auto;
    flex:1;min-height:0;
    -webkit-overflow-scrolling:touch;
  }
  .close{
    position:absolute;top:10px;right:10px;z-index:2;
    width:44px;height:44px;border-radius:50%;
    background:var(--panel-2);
    border:none;
    color:var(--txt);
    font-family:inherit;font-size:22px;line-height:1;cursor:pointer;
    display:grid;place-items:center;
    transition:background .15s ease,transform .08s ease;
  }
  .close:active{background:var(--border);transform:scale(.92)}
  .modal h2{
    font-size:20px;font-weight:800;margin-bottom:4px;color:var(--txt);
    padding-right:50px;
  }
  .answer-line{font-size:13px;color:var(--muted);margin-bottom:16px}
  .answer-line b{color:var(--accent);letter-spacing:.14em;font-weight:800}

  /* big, unmistakable reveal of the correct word on a loss */
  .answer-reveal{
    text-align:center;
    margin:0 0 14px;              /* slight gap below the word card */
    padding:14px 12px 16px;
    border-radius:14px;
    background:linear-gradient(135deg,rgba(180,83,9,.10),rgba(245,158,11,.16));
    border:1px solid rgba(180,83,9,.26);
  }
  .answer-reveal .lbl{
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:800;color:#b45309;opacity:.9;
  }
  .answer-word{
    font-size:clamp(30px,11vw,46px);
    font-weight:900;
    letter-spacing:.13em;
    color:#b45309;
    line-height:1.08;
    margin-top:4px;
    text-transform:uppercase;
    word-break:break-word;
  }

  /* loss headline: centred, sitting beneath the word card */
  .modal .loss-title{
    text-align:center;
    padding-right:0;
    margin:0 0 18px;
  }

  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
  .stat{background:var(--panel-2);border-radius:11px;padding:10px 2px;text-align:center}
  .stat .v{font-size:19px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}
  .stat .l{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:700}

  .next-box{text-align:center;padding:12px;border-radius:12px;background:var(--accent-soft)}
  .next-box .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .next-box .time{font-size:24px;font-weight:800;letter-spacing:.05em;margin-top:4px;color:var(--accent);font-variant-numeric:tabular-nums}

  /* bonus round button, sits at the very bottom of the result popup */
  .bonus-btn{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    width:100%;margin-top:14px;padding:14px 16px;
    border:none;border-radius:14px;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    color:#fff;font-family:inherit;font-weight:800;
    font-size:15px;letter-spacing:.02em;line-height:1.15;
    cursor:pointer;text-align:center;
    box-shadow:0 8px 22px rgba(79,70,229,.32);
    transition:transform .08s ease,box-shadow .15s ease,filter .15s ease;
  }
  .bonus-btn .sub{
    font-size:10px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;opacity:.85;
  }
  .bonus-btn:active{transform:scale(.97);filter:brightness(.96);box-shadow:0 4px 14px rgba(79,70,229,.28)}

  /* ---------- short screens ---------- */
  @media (max-height:660px){
    .key{height:52px;font-size:14px}
    .key.wide{font-size:10px}
    .keyboard{gap:4px;padding:5px 4px}
    .icon-btn{width:44px;height:44px}
    .logo{width:36px;height:36px}
    .brand h1{font-size:16px}
    .pill{min-height:40px}
    .tile{border-width:1px}
  }
  @media (max-height:580px){
    .key{height:48px;font-size:13px}
    .keyboard{gap:3px;padding:4px 4px}
    header{padding:4px 10px 2px}
    .statusbar{padding:2px 10px 4px}
    .pill{min-height:38px;padding:0 10px;font-size:12px}
    .brand h1{font-size:15px;letter-spacing:.12em}
    .logo{width:34px;height:34px;font-size:16px}
    .icon-btn{width:42px;height:42px;font-size:16px}
  }

  /* ---------- landscape ---------- */
  @media (orientation:landscape) and (max-height:520px){
    header{padding:3px 10px 2px}
    .statusbar{padding:1px 10px 3px}
    .key{height:42px;font-size:12px}
    .key.wide{font-size:9px}
    .keyboard{gap:3px;padding:3px 4px}
    .pill{min-height:36px;font-size:12px;padding:0 10px}
    .logo{width:32px;height:32px;font-size:15px;border-radius:8px}
    .icon-btn{width:40px;height:40px;border-radius:9px;font-size:15px}
    .brand h1{font-size:14px}
    .board-wrap{padding:2px 6px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">7</div>
    <h1>SEVEN</h1>
  </div>
  <button class="icon-btn" id="statsBtn" aria-label="Statistics">▤</button>
</header>

<div class="statusbar">
  <button class="pill" id="hintBtn" aria-label="Hint">
    <span class="sparkle">✦</span>
    <span id="hintLabel">Hint</span>
  </button>
  <div class="pill countdown-pill">Next <b class="js-countdown">--:--:--</b></div>
</div>

<div class="board-wrap">
  <div class="board" id="board" aria-label="Seven by seven word grid"></div>
</div>

<div class="keyboard" id="keyboard"></div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="closeModal" aria-label="Close">×</button>
    <div class="modal-body" id="modalContent"></div>
  </div>
</div>

  var DAY_MS = 86400000;
  var ukFmt = null;
  try {
    var probe = new Intl.DateTimeFormat('en-GB', {

  function ukParts(d) {
    var date = d || new Date();
    if (ukFmt) {
      var out = {}, parts = ukFmt.formatToParts(date);
      for (var i = 0; i < parts.length; i++) if (parts[i].type !== 'literal') out[parts[i].type] = parts[i].value;
      return out;
    }
    return {
      year: String(date.getUTCFullYear()), month: pad2(date.getUTCMonth() + 1),
      day: pad2(date.getUTCDate()), hour: pad2(date.getUTCHours()),
      minute: pad2(date.getUTCMinutes()), second: pad2(date.getUTCSeconds())

  function dayIndex(key) { var b = key.split('-'); return Math.round(Date.UTC(+b[0], +b[1] - 1, +b[2]) / DAY_MS); }
  function secondsToMidnight() {
    var p = ukParts();
    return 86400 - ((+p.hour) * 3600 + (+p.minute) * 60 + (+p.second));

  }

  function mulberry32(a) {
    return function () {

      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

    }
    return arr;

    try {
      var raw = JSON.parse(retrieve(STATE_KEY) || 'null');
      if (raw && raw.day === today) {
        if (Array.isArray(raw.guesses)) {
          /* legacy single-game save */
          save = { day: today, mode: 'daily', daily: sanitizeGame(raw), bonus: null };
        } else if (raw.daily) {
          save = {
            day: today,
            mode: raw.mode === 'bonus' ? 'bonus' : 'daily',
            daily: sanitizeGame(raw.daily),
            bonus: raw.bonus ? sanitizeGame(raw.bonus) : null
          };
        }
        if (save) {
          if (save.mode === 'bonus' && save.bonus) {
            game = save.bonus;
          } else {
            save.mode = 'daily';
            game = save.daily;
          }
          return;
        }
      }
    } catch (e) {}
    save = newSave(today);
    game = save.daily;
    saveGame();
  }

  /* =========================================================
     SCORING
     ========================================================= */
  function scoreGuess(guess, target) {
    var res = new Array(SIZE), counts = {}, i, ch;
    for (i = 0; i < SIZE; i++) res[i] = (guess.charAt(i) === target.charAt(i)) ? 'correct' : 'absent';
    for (i = 0; i < SIZE; i++) {
      if (res[i] === 'correct') continue;
      ch = target.charAt(i); counts[ch] = (counts[ch] || 0) + 1;
    }
    for (i = 0; i < SIZE; i++) {
      if (res[i] === 'correct') continue;
      ch = guess.charAt(i);
      if (counts[ch] > 0) { res[i] = 'present'; counts[ch]--; }
    }
    return res;
  }

  /* =========================================================
     BOARD SIZING
     ========================================================= */
  function fitBoard() {
    if (!wrapEl) return;
    var cs = window.getComputedStyle(wrapEl);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    var availW = wrapEl.clientWidth - padX - 4;
    var availH = wrapEl.clientHeight - padY - 4;
    if (availW < 40 || availH < 40) return;

    var gap = 5, pad = 8;
    var byW = Math.floor((availW - 6 * gap - 2 * pad) / SIZE);
    var byH = Math.floor((availH - 6 * gap - 2 * pad) / SIZE);
    var tile = Math.min(byW, byH);
    if (!isFinite(tile) || tile < 16) tile = 16;
    /* Cap the tiles on very large screens so the board stays a
       comfortable size rather than filling the whole viewport. */
    if (tile > 64) tile = 64;
    boardEl.style.setProperty('--tile', tile + 'px');
    boardEl.style.setProperty('--gap', gap + 'px');
    boardEl.style.setProperty('--pad', pad + 'px');
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    tiles = [];
    for (var r = 0; r < MAX_GUESSES; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) {
        var t = document.createElement('div');
        t.className = 'tile';
        t.setAttribute('data-row', r); t.setAttribute('data-col', c);
        boardEl.appendChild(t); row.push(t);
      }
      tiles.push(row);
    }
  }

  function clearTile(t) {
    t.textContent = ''; t.className = 'tile'; t.style.animation = ''; t.style.animationDelay = '';
  }

  function renderFromState() {
    for (var r = 0; r < MAX_GUESSES; r++) for (var c = 0; c < SIZE; c++) clearTile(tiles[r][c]);
    for (var k in keyState) if (Object.prototype.hasOwnProperty.call(keyState, k)) delete keyState[k];
    for (var g = 0; g < game.guesses.length && g < MAX_GUESSES; g++) {
      var guess = game.guesses[g], sc = scoreGuess(guess, answer);
      for (var i = 0; i < SIZE; i++) {
        tiles[g][i].textContent = guess.charAt(i);
        tiles[g][i].classList.add(sc[i]);
      }
      applyKeyState(guess, sc);
    }
    paintKeyboard();
    renderHint();
  }

  /* =========================================================
     KEYBOARD
     ========================================================= */
  var KEY_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['ENTER','Z','X','C','V','B','N','M','DEL']
  ];
  function buildKeyboard() {
    keyboardEl.innerHTML = '';
    KEY_ROWS.forEach(function (row) {
      var rowEl = document.createElement('div');
      rowEl.className = 'krow';
      row.forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'key' + (k.length > 1 ? ' wide' : '');
        b.textContent = k;
        b.setAttribute('data-key', k);
        b.addEventListener('click', function () { handleKey(k); });
        rowEl.appendChild(b);
      });
      keyboardEl.appendChild(rowEl);
    });
  }
  function applyKeyState(guess, sc) {
    for (var i = 0; i < SIZE; i++) {
      var ch = guess.charAt(i), st = sc[i];
      if (!(ch in keyState) || RANK[st] > RANK[keyState[ch]]) keyState[ch] = st;
    }
  }
  function paintKeyboard() {
    var keys = keyboardEl.querySelectorAll('.key');
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], ch = k.getAttribute('data-key');
      k.classList.remove('correct','present','absent');
      if (keyState[ch]) k.classList.add(keyState[ch]);
    }
  }

  /* =========================================================
     INPUT
     ========================================================= */
  function handleKey(k) {
    if (busy || !game) return;
    if (k === 'ENTER') { submitGuess(); return; }
    if (k === 'DEL') { deleteLetter(); return; }
    if (/^[A-Z]$/.test(k)) addLetter(k);
  }
  function addLetter(ch) {
    if (game.status !== 'playing') return;
    if (current.length >= SIZE) return;
    var r = game.guesses.length;
    if (r >= MAX_GUESSES) return;
    var c = current.length;
    current += ch;
    var t = tiles[r][c];
    t.classList.remove('invalid', 'duplicate');
    t.textContent = ch; t.classList.add('filled');
    t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  }
  function deleteLetter() {
    if (game.status !== 'playing' || current.length === 0) return;
    var r = game.guesses.length, c = current.length - 1;
    current = current.slice(0, -1);
    clearTile(tiles[r][c]);
  }

  var shakeTimer = null;
  /* kind: 'red' for words not in the dictionary,
           'orange' for words already guessed this game. */
  function shakeRow(r, kind) {
    for (var c = 0; c < SIZE; c++) {
      var t = tiles[r][c];
      t.classList.remove('shake', 'invalid', 'duplicate');
      void t.offsetWidth;
      t.classList.add('shake');
      if (kind === 'red') t.classList.add('invalid');
      else if (kind === 'orange') t.classList.add('duplicate');
    }
    if (kind) {
      clearTimeout(shakeTimer);
      shakeTimer = setTimeout(function () {
        for (var i = 0; i < SIZE; i++) {
          tiles[r][i].classList.remove('invalid', 'duplicate');
        }
      }, 520);
    }
  }

  /* =========================================================
     SUBMIT  — must be in the dictionary and not already guessed
     ========================================================= */
  function submitGuess() {
    if (game.status !== 'playing' || busy) return;
    var row = game.guesses.length;
    if (row >= MAX_GUESSES) return;
    if (current.length < SIZE) { toast('Not enough letters'); shakeRow(row); return; }
    /* A word may only be guessed once per game — repeated guesses
       are rejected without using up a turn. */
    if (game.guesses.indexOf(current) !== -1) {
      toast('Already guessed');
      shakeRow(row, 'orange');
      return;
    }
    /* Word must exist in the CSW list — otherwise the guess is not
       counted and the player keeps their turn. */
    if (!seen[current]) { toast('Not in word list'); shakeRow(row, 'red'); return; }

    var guess = current, sc = scoreGuess(guess, answer);
    game.guesses.push(guess); current = ''; saveGame(); busy = true;
    for (var ci = 0; ci < SIZE; ci++) tiles[row][ci].classList.remove('invalid', 'duplicate');
    var STEP = 95;
    for (var c = 0; c < SIZE; c++) {
      var t = tiles[row][c];
      t.classList.remove('filled');
      t.style.animation = 'flip 460ms cubic-bezier(.4,0,.3,1) ' + (c * STEP) + 'ms both';
      (function (tile, state, delay) {
        setTimeout(function () { tile.classList.add(state); }, delay + 225);
      })(t, sc[c], c * STEP);
    }
    var total = SIZE * STEP + 480;
    setTimeout(function () {
      for (var i = 0; i < SIZE; i++) tiles[row][i].style.animation = '';
      applyKeyState(guess, sc); paintKeyboard();
      if (guess === answer) {
        game.status = 'won'; saveGame(); recordResult(true); danceRow(row);
        setTimeout(function () { showResult(true); }, 650);
      } else if (game.guesses.length >= MAX_GUESSES) {
        game.status = 'lost'; saveGame(); recordResult(false);
        setTimeout(function () { showResult(false); }, 400);
      }
      busy = false;
    }, total);
  }
  function danceRow(r) {
    for (var c = 0; c < SIZE; c++) tiles[r][c].style.animation = 'dance 620ms ease ' + (c * 75) + 'ms';
    setTimeout(function () {
      for (var i = 0; i < SIZE; i++) tiles[r][i].style.animation = '';
    }, SIZE * 75 + 700);
  }

  /* =========================================================
     STATS
     A bonus win upgrades the day from a loss to a win.
     ========================================================= */
  function recordResult(won) {
    if (game.counted) return;
    game.counted = true; saveGame();
    var s = loadStats();
    var todayNum = dayIndex(save.day);
    var isBonus = (save.bonus && game === save.bonus);

    if (isBonus) {
      /* The daily loss has already been counted. Only a bonus win
         changes the record: it becomes a win for today. */
      if (won) {
        s.wins = (s.wins || 0) + 1;
        s.streak = (s.lastWinDay === todayNum - 1) ? (s.streak || 0) + 1 : 1;
        s.lastWinDay = todayNum;
        if (s.streak > (s.maxStreak || 0)) s.maxStreak = s.streak;
        var bn = game.guesses.length;
        s.dist[bn] = (s.dist[bn] || 0) + 1;
      }
      saveStats(s);
      return;
    }

    s.played = (s.played || 0) + 1;
    if (won) {
      s.wins = (s.wins || 0) + 1;
      s.streak = (s.lastWinDay === todayNum - 1) ? (s.streak || 0) + 1 : 1;
      s.lastWinDay = todayNum;
      if (s.streak > (s.maxStreak || 0)) s.maxStreak = s.streak;
      var n = game.guesses.length;
      s.dist[n] = (s.dist[n] || 0) + 1;
    } else s.streak = 0;
    saveStats(s);
  }

  /* =========================================================
     HINT — inline in the pill
     ========================================================= */
  function useHint() {
    if (!game) return;
    if (game.status !== 'playing') { toast('Game already finished'); return; }
    if (game.hintUsed) { toast('Hint already used'); return; }
    var revealed = {};
    game.guesses.forEach(function (g) {
      var sc = scoreGuess(g, answer);
      for (var i = 0; i < SIZE; i++) if (sc[i] === 'correct') revealed[i] = true;
    });
    var pool = [];
    for (var i = 0; i < SIZE; i++) if (!revealed[i]) pool.push(i);
    if (pool.length === 0) pool = [0,1,2,3,4,5,6];
    var pos = pool[Math.floor(Math.random() * pool.length)];
    game.hintUsed = true;
    game.hint = { pos: pos, letter: answer.charAt(pos) };
    saveGame(); renderHint();
    toast('Hint used');
  }

  function renderHint() {
    if (!game) return;
    if (game.hintUsed && game.hint) {
      hintBtn.disabled = true;
      hintBtn.classList.add('used');
      hintLabel.innerHTML = 'Letter ' + (game.hint.pos + 1) + ' = <b>' + game.hint.letter + '</b>';
    } else {
      hintBtn.disabled = false;
      hintBtn.classList.remove('used');
      hintLabel.textContent = 'Hint';
    }
  }

  /* =========================================================
     TOAST
     ========================================================= */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  /* =========================================================
     MODAL — stats only vs. end-of-game result
     ========================================================= */
  function statBox(v, l) {
    return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
  }

  /* Stats grid + countdown. No guess distribution. */
  function statsBodyHTML() {
    var s = loadStats();
    var winPct = s.played ? Math.round((s.wins / s.played) * 100) : 0;

    var html = '<div class="stats-grid">' +
      statBox(s.played || 0, 'Played') +
      statBox(winPct + '%', 'Win rate') +
      statBox(s.streak || 0, 'Streak') +
      statBox(s.maxStreak || 0, 'Best') +
      '</div>';

    html += '<div class="next-box">' +
      '<div class="lbl">Next word in</div>' +
      '<div class="time js-countdown">--:--:--</div>' +
      '</div>';

    return html;
  }

  function showStats() {
    modalContent.innerHTML = '<h2>Statistics</h2>' + statsBodyHTML();
    overlay.hidden = false;
    updateCountdowns(secondsToMidnight());
  }

  function showResult(won) {
    var isBonus = !!(save.bonus && game === save.bonus);
    var html = '';

    if (won) {
      var n = game.guesses.length;
      var title = n === 1 ? 'Flawless.' : n <= 3 ? 'Excellent work.' : n <= 5 ? 'Nicely done.' : 'Just in time.';
      html += '<h2>' + title + '</h2>';
      html += '<div class="answer-line">' +
        (isBonus ? 'Bonus word solved in <b>' : 'Solved in <b>') + n + '</b> of 7</div>';
    } else {
      /* The correct word comes first, deliberately far larger than
         the headline, with a slight gap beneath it. */
      html += '<div class="answer-reveal">' +
        '<div class="lbl">The correct word was</div>' +
        '<div class="answer-word">' + answer + '</div>' +
        '</div>';
      html += '<h2 class="loss-title">Better luck tomorrow!</h2>';
    }

    html += statsBodyHTML();

    /* One bonus game per day, offered only after losing the daily word.
       Once the bonus game exists (played, won or lost), no more are offered. */
    if (!won && !isBonus && !save.bonus) {
      html += '<button class="bonus-btn" id="bonusBtn" type="button">' +
        'Play one more bonus game' +
        '<span class="sub">One extra chance to win today</span>' +
        '</button>';
    }

    modalContent.innerHTML = html;
    var bb = document.getElementById('bonusBtn');
    if (bb) bb.addEventListener('click', startBonus);
    overlay.hidden = false;
    updateCountdowns(secondsToMidnight());
  }

  function closeModal() { overlay.hidden = true; }

  /* =========================================================
     BONUS ROUND — only unlocked by losing the daily game
     ========================================================= */
  function startBonus() {
    if (!save || save.bonus) return;              // already used today
    if (save.daily.status !== 'lost') return;     // won the daily → no bonus
    save.bonus = freshGameObj();
    save.mode = 'bonus';
    game = save.bonus;
    answer = bonusAnswerForDay(save.day);
    current = ''; busy = false;
    saveGame();
    closeModal();
    renderFromState();
    toast('Bonus word — good luck!');
  }

  /* =========================================================
     COUNTDOWN / ROLLOVER (daily reset at 00:00 UK)
     ========================================================= */
  function updateCountdowns(secs) {
    var txt = fmtClock(secs);
    var els = document.querySelectorAll('.js-countdown');
    for (var i = 0; i < els.length; i++) els[i].textContent = txt;
  }
  function tick() {
    updateCountdowns(secondsToMidnight());
    if (save && todayKey() !== save.day) startNewDay();
  }
  function startNewDay() {
    var key = todayKey();
    save = newSave(key);
    game = save.daily;
    saveGame();
    answer = answerForDay(key); current = ''; busy = false;
    closeModal(); renderFromState(); toast('New word ready');
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === 'Escape') { closeModal(); return; }
    if (k === 'Enter') { e.preventDefault(); handleKey('ENTER'); }
    else if (k === 'Backspace') { e.preventDefault(); handleKey('DEL'); }
    else if (/^[a-zA-Z]$/.test(k)) { e.preventDefault(); handleKey(k.toUpperCase()); }
  });
  hintBtn.addEventListener('click', useHint);
  document.getElementById('statsBtn').addEventListener('click', showStats);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

  var resizeTimer = null;
  function scheduleFit() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitBoard, 60);
  }
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('orientationchange', function () { setTimeout(fitBoard, 180); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleFit);
  }

  /* =========================================================
     BOOT
     ========================================================= */
  function init() {
    try { loadGame(); } catch (e) { save = newSave(todayKey()); game = save.daily; }
    if (!save || !game) { save = newSave(todayKey()); game = save.daily; }

    try {
      answer = (save.bonus && game === save.bonus)
        ? bonusAnswerForDay(save.day)
        : answerForDay(save.day);
    } catch (e) { answer = 'JOURNEY'; }

    buildBoard();
    buildKeyboard();
    try { renderFromState(); } catch (e) {}

    fitBoard();
    setTimeout(fitBoard, 30);
    setTimeout(fitBoard, 150);
    setTimeout(fitBoard, 500);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoard);

    if (window.ResizeObserver && wrapEl) {
      try { new ResizeObserver(fitBoard).observe(wrapEl); } catch (e) {}
    }

    /* Show the result modal once per finished game.
       If the daily game was lost and the bonus is still available,
       re-show it so the player doesn't lose their extra chance. */
    if (game.status === 'won' || game.status === 'lost') {
      var wasWon = (game.status === 'won');
      var bonusPending = (game.status === 'lost' && game === save.daily && !save.bonus);
      if (!game.seenResult || bonusPending) {
        if (!game.seenResult) { game.seenResult = true; saveGame(); }
        setTimeout(function () { showResult(wasWon); }, 350);
      }
    }

    tick();
    setInterval(tick, 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
